<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zmanim Pro - Dashboard</title>
    <link rel="stylesheet" href="dist/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Montre suisse -->
    <script src="suisseclock.js"></script>

    <style>
        /* ─── Base ─────────────────────────────────────────────── */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Heebo', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        .digital-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .settings-button {
            position: fixed;
            left: 18px;
            bottom: 84px;
            z-index: 70;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: stretch;
            justify-content: center;
            color: #fbce07;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(251, 206, 7, 0.55);
            border-radius: 999px;
            box-shadow: 0 0 14px rgba(251, 206, 7, 0.28), 0 0 34px rgba(251, 206, 7, 0.14);
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .settings-button:hover {
            transform: translateY(-2px);
            background: rgba(251, 206, 7, 0.14);
            border-color: rgba(251, 206, 7, 0.9);
        }

        .settings-button svg {
            width: 22px;
            height: 22px;
        }

         /* ─── Header layout ─────────────────────────────────────── */
        .top-menu {
            padding-top: 0.25rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        }

        .header-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(245px, 280px);
            gap: 10px;
            align-items: stretch;
            direction: ltr;
        }

        .header-card{
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(251,206,7,0.35);
            border-radius:12px;
            padding:0.34rem 0.82rem;
            min-width:0;
            overflow:hidden;
            direction:rtl;
            box-shadow:0 0 12px rgba(251,206,7,0.22),0 0 32px rgba(251,206,7,0.10);
        }

        .parasha-card { overflow:hidden; min-height:82px; }
        .header-title-line { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

        .weather-card {
            display:flex;
            flex-direction:column;
            gap:0.36rem;
        }

        .weather-city {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:0.45rem;
            color:#fbce07;
            font-weight:900;
            font-size:1.05rem;
            line-height:1.1;
            white-space:nowrap;
        }

        .weather-city svg {
            width:18px;
            height:18px;
        }

        .weather-days {
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap:0.34rem;
            min-height:0;
        }

        .weather-day {
            display:flex;
            flex-direction:column;
            align-items:center;
            border:1px solid rgba(255,255,255,0.10);
            border-radius:10px;
            background:rgba(255,255,255,0.045);
            padding:0.26rem 0.34rem 0.28rem;
            min-width:0;
        }

        .weather-icon {
            flex:none;
            stroke-width:2.35;
            filter:drop-shadow(0 0 7px rgba(255,255,255,0.12));
        }

        .weather-icon-main {
            width:1.42rem;
            height:1.42rem;
            margin:0 auto -0.06rem;
        }

        .weather-icon-mini {
            width:0.90rem;
            height:0.90rem;
            margin-bottom:-0.03rem;
        }

        .weather-icon-sunny {
            color:#facc15;
            filter:drop-shadow(0 0 9px rgba(250,204,21,0.42));
        }

        .weather-icon-partly {
            color:#38bdf8;
            filter:drop-shadow(0 0 8px rgba(56,189,248,0.35));
        }

        .weather-icon-cloudy {
            color:#cbd5e1;
        }

        .weather-icon-fog {
            color:#94a3b8;
        }

        .weather-icon-drizzle,
        .weather-icon-rain {
            color:#38bdf8;
        }

        .weather-icon-snow {
            color:#e0f2fe;
        }

        .weather-icon-storm {
            color:#facc15;
            filter:drop-shadow(0 0 10px rgba(250,204,21,0.45));
        }

        .weather-day-head {
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:baseline;
            gap:0.25rem;
            color:rgba(255,255,255,0.78);
            font-size:0.70rem;
            font-weight:900;
            white-space:nowrap;
        }

        .weather-slots {
            width:100%;
            display:grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap:0.14rem;
            margin-top:0.16rem;
        }

        .weather-slot {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:0.05rem;
            min-width:0;
            color:rgba(255,255,255,0.50);
            font-size:0.56rem;
            font-weight:800;
        }

        .weather-slot strong {
            color:#38bdf8;
            font-size:1.02rem;
            line-height:1;
        }

        .weather-day:nth-child(2) .weather-slot strong { color:#fb923c; }
        .weather-day:nth-child(3) .weather-slot strong { color:#a78bfa; }

        .weather-desc {
            margin-top:0.15rem;
            color:rgba(255,255,255,0.42);
            font-size:0.66rem;
            font-weight:800;
            text-align:center;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .weather-loading {
            grid-column:1 / -1;
            min-height:64px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:rgba(255,255,255,0.42);
            font-weight:900;
        }

        .date-card {
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        @media (max-width: 1500px) {
            .header-grid { grid-template-columns: minmax(0, 1fr) minmax(230px, 260px); gap:10px; }
            .header-card { padding:0.34rem 0.72rem; }
        }

        @media (max-width: 1150px) {
            .header-grid { grid-template-columns: minmax(0, 1fr) minmax(210px, 230px); gap:8px; }
            .header-title-line { font-size:1.25rem; }
            .weather-slot strong { font-size:0.95rem; }
        }

		.center-clock-layout {
			direction: ltr;
			display: grid;
			grid-template-columns: minmax(240px, 1fr) auto minmax(240px, 1fr);
			align-items: center;
			justify-content: center;
			column-gap: 0;
			width: 100%;
			max-width: 100%;
			height: 100%;
			padding: 0 clamp(8px, 1.2vw, 22px);
			min-height: 0;
		}

		.clock-info-panel {
			direction: rtl;
			justify-self: center;
			align-self: center;
			width: clamp(220px, 24vw, 330px);
			min-width: 220px;
			margin-right: 0;
			transform: none;
			z-index: 5;
		}

		.clock-weather-panel {
			direction: rtl;
			justify-self: center;
			align-self: center;
			width: clamp(300px, 28vw, 382px);
			min-width: 0;
			max-height: 100%;
			z-index: 5;
		}

		.side-weather-card {
			position: relative;
			width: 100%;
			max-height: 100%;
			gap: 0.56rem;
			padding: 0.68rem 0.72rem 0.74rem;
			overflow: visible;
			background:
				radial-gradient(circle at 82% 7%, rgba(251,206,7,0.22), transparent 32%),
				radial-gradient(circle at 6% 58%, rgba(56,189,248,0.16), transparent 42%),
				linear-gradient(145deg, rgba(5,12,16,0.96), rgba(7,7,7,0.94) 46%, rgba(24,20,4,0.82));
			border-color: rgba(251,206,7,0.54);
			box-shadow:
				0 0 18px rgba(251,206,7,0.24),
				0 0 54px rgba(251,206,7,0.12),
				inset 0 1px 0 rgba(255,255,255,0.10);
			backdrop-filter: blur(12px);
		}

		.side-weather-card::before {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
			background:
				linear-gradient(90deg, rgba(255,255,255,0.055), transparent 18%, transparent 82%, rgba(251,206,7,0.055)),
				repeating-linear-gradient(135deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 13px);
			opacity: 0.48;
		}

		.side-weather-card > * {
			position: relative;
			z-index: 1;
		}

		.side-weather-card .weather-city {
			align-self: center;
			min-width: 72%;
			font-size: 1.18rem;
			margin-bottom: 0.02rem;
			padding: 0.30rem 0.76rem;
			border: 1px solid rgba(251,206,7,0.25);
			border-radius: 999px;
			background: linear-gradient(90deg, rgba(251,206,7,0.16), rgba(255,255,255,0.055));
			box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
		}

		.weather-city-wrap {
			position: relative;
			display: flex;
			justify-content: center;
			z-index: 35;
		}

		.weather-city-button {
			font: inherit;
			cursor: pointer;
			transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
		}

		.weather-city-button:hover,
		.weather-city-button:focus-visible {
			transform: translateY(-1px);
			border-color: rgba(251,206,7,0.62);
			background: linear-gradient(90deg, rgba(251,206,7,0.23), rgba(56,189,248,0.10));
			box-shadow:
				0 0 16px rgba(251,206,7,0.18),
				inset 0 1px 0 rgba(255,255,255,0.11);
			outline: none;
		}

		.weather-city-picker {
			position: absolute;
			top: calc(100% + 0.42rem);
			left: 0;
			right: 0;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 0.24rem;
			max-height: 260px;
			overflow-y: auto;
			padding: 0.42rem;
			border: 1px solid rgba(251,206,7,0.42);
			border-radius: 12px;
			background: rgba(4,8,12,0.96);
			box-shadow:
				0 18px 34px rgba(0,0,0,0.58),
				0 0 28px rgba(251,206,7,0.12),
				inset 0 1px 0 rgba(255,255,255,0.08);
			backdrop-filter: blur(12px);
		}

		.weather-city-option {
			min-width: 0;
			padding: 0.34rem 0.42rem;
			border: 1px solid rgba(255,255,255,0.08);
			border-radius: 8px;
			background: rgba(255,255,255,0.045);
			color: rgba(255,255,255,0.72);
			font-size: 0.76rem;
			font-weight: 900;
			line-height: 1.05;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
		}

		.weather-city-option:hover,
		.weather-city-option.active {
			border-color: rgba(56,189,248,0.52);
			background: rgba(56,189,248,0.14);
			color: #ffffff;
		}

		.side-weather-card .weather-city svg {
			width: 20px;
			height: 20px;
		}

		.side-weather-card .weather-days {
			grid-template-columns: 1fr;
			gap: 0.46rem;
		}

		.side-weather-card .weather-day {
			--weather-rgb: 56,189,248;
			position: relative;
			direction: ltr;
			display: grid;
			grid-template-columns: 4.55rem minmax(0, 1fr);
			grid-template-areas:
				"icon head"
				"icon slots"
				"icon desc";
			align-items: center;
			column-gap: 0.70rem;
			row-gap: 0.14rem;
			padding: 0.52rem 0.62rem 0.54rem;
			min-height: 116px;
			overflow: hidden;
			border-color: rgba(var(--weather-rgb),0.35);
			background:
				radial-gradient(circle at 10% 50%, rgba(var(--weather-rgb),0.27), transparent 34%),
				linear-gradient(90deg, rgba(var(--weather-rgb),0.12), rgba(255,255,255,0.055) 42%, rgba(0,0,0,0.24));
			box-shadow:
				inset 0 1px 0 rgba(255,255,255,0.10),
				0 8px 22px rgba(0,0,0,0.28);
		}

		.side-weather-card .weather-day:nth-child(2) {
			--weather-rgb: 251,146,60;
		}

		.side-weather-card .weather-day:nth-child(3) {
			--weather-rgb: 167,139,250;
		}

		.side-weather-card .weather-day::before {
			content: "";
			position: absolute;
			left: 0;
			top: 0;
			bottom: 0;
			width: 4px;
			background: rgb(var(--weather-rgb));
			box-shadow: 0 0 18px rgba(var(--weather-rgb),0.58);
		}

		.side-weather-card .weather-icon-main {
			grid-area: icon;
			width: 3.10rem;
			height: 3.10rem;
			color: rgb(var(--weather-rgb));
			margin: 0;
			padding: 0.40rem;
			justify-self: center;
			align-self: center;
			box-sizing: content-box;
			border: 1px solid rgba(var(--weather-rgb),0.34);
			border-radius: 18px;
			background:
				radial-gradient(circle, rgba(var(--weather-rgb),0.22), rgba(255,255,255,0.055) 60%, rgba(0,0,0,0.28));
			box-shadow:
				0 0 22px rgba(var(--weather-rgb),0.20),
				inset 0 1px 0 rgba(255,255,255,0.10);
			stroke-width: 2.05;
		}

		.side-weather-card .weather-day-head {
			grid-area: head;
			direction: rtl;
			justify-content: center;
			text-align: center;
			font-size: 0.92rem;
			line-height: 1;
			color: rgba(255,255,255,0.88);
			letter-spacing: 0;
		}

		.side-weather-card .weather-slots {
			grid-area: slots;
			direction: rtl;
			margin-top: 0;
			gap: 0.30rem;
			align-items: end;
		}

		.side-weather-card .weather-slot {
			gap: 0.04rem;
			padding: 0.16rem 0.10rem 0.13rem;
			border: 1px solid rgba(255,255,255,0.075);
			border-radius: 8px;
			background: rgba(0,0,0,0.24);
			box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
			font-size: 0.64rem;
			line-height: 1.05;
		}

		.side-weather-card .weather-icon-mini {
			width: 1.18rem;
			height: 1.18rem;
			color: rgb(var(--weather-rgb));
			margin-bottom: 0.02rem;
			stroke-width: 2.28;
			filter: drop-shadow(0 0 8px rgba(var(--weather-rgb),0.35));
		}

		.side-weather-card .weather-day .weather-slot strong {
			color: rgb(var(--temp-rgb));
			font-size: 1.18rem;
			text-shadow: 0 0 10px rgba(var(--temp-rgb),0.44);
		}

		.side-weather-card .weather-desc {
			grid-area: desc;
			direction: rtl;
			margin-top: 0.02rem;
			color: rgba(255,255,255,0.54);
			font-size: 0.74rem;
			text-align: right;
		}

		.side-weather-card {
			width: clamp(285px, 28vw, 370px);
			aspect-ratio: 1 / 1;
			max-height: min(100%, 370px);
			padding: 1rem 1rem 0.92rem;
			border: 0;
			border-radius: 13px;
			color: #ffffff;
			background:
				radial-gradient(circle at 23% 9%, rgba(255,255,255,0.44), transparent 28%),
				radial-gradient(circle at 18% 34%, rgba(255,255,255,0.18), transparent 34%),
				linear-gradient(145deg, #139fd1 0%, #0879b4 47%, #03507f 100%);
			box-shadow:
				0 18px 44px rgba(0,0,0,0.46),
				0 0 34px rgba(56,189,248,0.18),
				inset 0 1px 0 rgba(255,255,255,0.32);
		}

		.side-weather-card::before {
			border-radius: inherit;
			background:
				linear-gradient(180deg, rgba(255,255,255,0.16), transparent 46%),
				radial-gradient(circle at 70% 18%, rgba(255,255,255,0.16), transparent 24%);
			opacity: 0.85;
		}

		.weather-hero {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: start;
			min-height: 68%;
			direction: ltr;
		}

		.side-weather-card .weather-city {
			position: absolute;
			top: 0;
			left: 0;
			z-index: 6;
			min-width: 0;
			padding: 0.26rem 0.54rem;
			border: 1px solid rgba(255,255,255,0.28);
			background: rgba(155,0,0,1);
			color: rgba(255,255,255,0.82);
			box-shadow: none;
			font-size: 0.74rem;
			line-height: 1;
		}

		.side-weather-card .weather-city svg {
			width: 14px;
			height: 14px;
		}

		.weather-city-picker {
			top: 2.15rem;
			left: 0;
			right: auto;
			width: min(330px, 90vw);
			z-index: 90;
		}

		.weather-hero-icon {
			align-self: center;
			justify-self: start;
			margin-top: 2.15rem;
			margin-left: 0.1rem;
		}

		.side-weather-card .weather-icon-hero {
			width: clamp(6.4rem, 9.2vw, 8.2rem);
			height: clamp(6.4rem, 9.2vw, 8.2rem);
			color: rgb(var(--weather-rgb));
			stroke-width: 1.85;
			filter:
				drop-shadow(0 0 1px rgba(255,255,255,0.55))
				drop-shadow(0 14px 18px rgba(0,42,72,0.34));
		}

		.weather-hero-metrics {
			justify-self: end;
			text-align: left;
			padding-top: 1.12rem;
			text-shadow: 0 8px 22px rgba(0,50,85,0.24);
		}

		.weather-hero-temp {
			color: rgb(var(--temp-rgb));
			font-size: clamp(4.1rem, 6.2vw, 5.6rem);
			font-weight: 900;
			line-height: 0.86;
			letter-spacing: 0;
			text-shadow: 0 0 18px rgba(var(--temp-rgb),0.26), 0 5px 18px rgba(0,44,74,0.20);
		}

		.weather-hero-time {
			margin-top: 0.34rem;
			color: rgba(255,255,255,0.94);
			font-size: clamp(1.75rem, 2.6vw, 2.35rem);
			font-weight: 500;
			line-height: 1;
			letter-spacing: 0;
		}

		.weather-forecast-strip {
			position: relative;
			z-index: 2;
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 0.42rem;
			align-items: end;
			direction: ltr;
		}

		.weather-forecast-day {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: end;
			gap: 0.22rem;
			min-width: 0;
			color: #ffffff;
		}

		.weather-forecast-day .weather-day-head {
			display: block;
			width: auto;
			color: rgba(255,255,255,0.92);
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.74rem;
			font-weight: 800;
			line-height: 1;
			text-align: center;
		}

		.side-weather-card .weather-icon-forecast {
			width: clamp(2.05rem, 3vw, 2.72rem);
			height: clamp(2.05rem, 3vw, 2.72rem);
			color: rgb(var(--weather-rgb));
			stroke-width: 2.05;
			filter: drop-shadow(0 6px 8px rgba(0,51,83,0.30));
		}

		.weather-forecast-temp {
			color: rgb(var(--temp-rgb));
			font-size: clamp(0.90rem, 1.25vw, 1.05rem);
			font-weight: 800;
			line-height: 1;
			text-shadow: 0 0 8px rgba(var(--temp-rgb),0.25);
		}

		.weather-forecast-day .weather-slots,
		.weather-forecast-day .weather-desc {
			display: none;
		}

		.clock-canvas-wrap {
			width: 100%;
			height: 100%;
			min-height: 280px;
			display: flex;
			align-items: stretch;
			justify-content: center;
			justify-self: center;
			overflow: visible;
		}

		.clock-canvas-wrap canvas {
			width: auto;
			height: 100%;
			flex: none;
		}

        @media (max-width: 900px) {
            .center-clock-layout {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(220px, 1fr) auto auto;
                gap: 12px;
            }

            .clock-info-panel {
                order: 2;
                width: 100%;
                min-width: 0;
                justify-self: center;
            }

            .clock-canvas-wrap { order: 1; }

            .clock-weather-panel {
                order: 3;
                justify-self: center;
                width: 100%;
            }

            .side-weather-card .weather-days {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .side-weather-card .weather-day {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "icon"
                    "head"
                    "slots"
                    "desc";
                min-height: 0;
            }
        }

        /* ─── Zman cards ────────────────────────────────────────── */
        .bottom-menu {
            width:100%;
            padding:0.34rem 0.48rem;
            border:1px solid rgba(255,255,255,0.10);
            border-radius:16px;
            background:linear-gradient(to top, rgba(0,0,0,0.92), rgba(255,255,255,0.045));
            box-shadow:0 -10px 30px rgba(0,0,0,0.55);
            backdrop-filter:blur(12px);
        }

        .zman-strip {
            direction:rtl;
            display:grid;
            grid-template-columns:repeat(10, minmax(92px, 1fr));
            gap:0.28rem;
            align-items:stretch;
        }

        .zman-card {
            background: rgba(255, 255, 255, 0.05);
            border: 0.2px solid rgba(255, 255, 255, 0.1);
            border-radius:10px;
            min-height:62px;
            padding:0.32rem 0.38rem;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:0.08rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            min-width:0;
        }

        .zman-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .active-zman {
            border: 2px solid #fbce07 !important;
            background: rgba(251, 206, 7, 0.12) !important;
            box-shadow: 0 0 16px rgba(251, 206, 7, 0.22);
        }

        .past-zman { opacity:0.58; }

        .zman-label {
            max-width:100%;
            color:rgba(255,255,255,0.86);
            font-size:clamp(0.68rem, 1.05vw, 0.96rem);
            line-height:1.05;
            font-weight:900;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .zman-time {
            font-size:clamp(1.22rem, 1.75vw, 1.72rem);
            line-height:1.05;
            font-weight:800;
            letter-spacing:0;
            font-variant-numeric:tabular-nums;
        }

        .reminder-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #fbce07;
            width: 15px;
            height: 15px;
            animation: bounce 2s infinite;
        }


        /* ─── Footer ────────────────────────────────────────────── */
        .footer-gradient {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(255, 255, 255, 0.05));
        }

        /* ─── Modal ─────────────────────────────────────────────── */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
        }

        /* ─── Glow effects ──────────────────────────────────────── */
        .glow-text    { text-shadow: 0 0 18px rgba(251, 206, 7, 0.45); }
        .glow-red     { text-shadow: 0 0 14px rgba(239, 68, 68, 0.55); }
        .glow-orange  { text-shadow: 0 0 14px rgba(249, 115, 22, 0.55); }
        .glow-green   { text-shadow: 0 0 14px rgba(34, 197, 94, 0.55); }
        .glow-blue    { text-shadow: 0 0 14px rgba(59, 130, 246, 0.55); }
        .parasha-glow { text-shadow: 0 0 16px rgba(56, 189, 248, 0.45); }

        /* ─── Scrollbar ─────────────────────────────────────────── */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ─── Animations ────────────────────────────────────────── */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-4px); }
        }

        @keyframes progress-bar {
            0%   { width: 0%; }
            100% { width: 100%; }
        }

        .progress-animation { animation: progress-bar 30s linear; }

        /* ─── Omer ticker ───────────────────────────────────────── */
        .omer-ticker {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            direction: ltr;
            mask-image: linear-gradient(to right, transparent 0%, white 8%, white 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, white 8%, white 92%, transparent 100%);
        }

        .omer-track {
            display: inline-flex;
            align-items: center;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: omer-marquee 12s linear infinite;
        }

        .omer-track:hover { animation-play-state: paused; }

        .omer-item {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            padding-right: 3rem;
            direction: rtl;
        }

        @keyframes omer-marquee {
            from { transform: translateX(-50%); }
            to   { transform: translateX(0); }
        }

        /* ─── Pasuk ticker ────────────────────────────────────────
           Important: le passouk est toujours rendu dans une zone avec hauteur minimale.
           Si l'appel API échoue, le composant affiche un message de secours. */
        .pasuk-ticker {
            width: 100%;
            min-height: 34px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            margin-top: 0.25rem;
            padding-top: 0.25rem;
            display:flex;
            align-items:center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            direction: ltr;
            mask-image: linear-gradient(to right, transparent 0%, white 6%, white 94%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, white 6%, white 94%, transparent 100%);
        }
        .pasuk-track { display:inline-flex; align-items:center; white-space:nowrap; width:max-content; will-change:transform; animation:pasuk-marquee 22s linear infinite; }
        .pasuk-track:hover { animation-play-state: paused; }
        .pasuk-item { display:inline-flex; align-items:center; flex-shrink:0; padding-right:4rem; direction:rtl; }
        .pasuk-text { font-family:'Heebo', Arial, sans-serif; font-size:0.92rem; line-height:1.25; font-weight:700; color:rgba(255,255,255,0.96); }
        .pasuk-ref { color:#fbce07; white-space:nowrap; margin-left:0.6rem; font-weight:900; }
        .pasuk-separator { color:rgba(251,206,7,0.72); margin:0 0.9rem; font-weight:900; }
        .pasuk-next-label { color:#38bdf8; margin-left:0.45rem; font-weight:900; }
        @keyframes pasuk-marquee { from { transform:translateX(-50%); } to { transform:translateX(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

<script>
    const appScript = document.createElement('script');
    appScript.src = `dist/app.js?v=${Date.now()}`;
    document.body.appendChild(appScript);
</script>
</body>
</html>
